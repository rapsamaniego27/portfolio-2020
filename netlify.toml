[build]
  command = "bundle exec ruby source/scripts/netlify-projects.rb && npm run prod && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  # Hook builds refresh and save projects to GitHub before Jekyll renders them.
  # Normal Git/Decap builds keep using the committed export with Strapi offline.
  STRAPI_API_URL = "https://strapi-rap-v5.onrender.com/api"
  NODE_VERSION = "24.22.2"
  RUBY_VERSION = "3.4.12"
  NPM_FLAGS = "--include=dev"
  JEKYLL_ENV = "production"
